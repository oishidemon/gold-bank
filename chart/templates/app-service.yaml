apiVersion: v1
kind: Service
metadata:
  name: {{ include "gold-bank.fullname" . }}
  labels:
    {{- include "gold-bank.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "gold-bank.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.config.PORT | int }}
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
