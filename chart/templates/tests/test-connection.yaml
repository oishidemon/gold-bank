apiVersion: v1
kind: Pod
metadata:
  name: {{ include "gold-bank.fullname" . }}-test
  labels:
    {{- include "gold-bank.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: {{ .Values.waitImage }}
      command: ["wget"]
      args: ["-qO-", "http://{{ include "gold-bank.fullname" . }}:{{ .Values.service.port }}/"]
