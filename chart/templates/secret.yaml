apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gold-bank.fullname" . }}
  labels:
    {{- include "gold-bank.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secret.POSTGRES_PASSWORD | quote }}
  APP_PASSWORD: {{ .Values.secret.APP_PASSWORD | quote }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s-db:5432/%s" .Values.config.POSTGRES_USER .Values.secret.POSTGRES_PASSWORD (include "gold-bank.fullname" .) .Values.config.POSTGRES_DB | quote }}
