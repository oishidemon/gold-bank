# Defaults = development environment (same as the lab 3 manifests).
image:
  repository: gold-bank
  tag: "1.0.0"
  pullPolicy: IfNotPresent

app:
  replicaCount: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

service:
  type: NodePort
  port: 3000
  nodePort: ""        # empty = auto-assigned, so the chart can be installed twice

ingress:
  enabled: false
  className: nginx
  host: gold-bank.local

# ConfigMap (all values are strings)
config:
  PORT: "3000"
  NODE_ENV: production
  POSTGRES_USER: bank
  POSTGRES_DB: bank

# Secret. Demo values only: override with --set secret.APP_PASSWORD=... for anything real.
secret:
  POSTGRES_PASSWORD: demo-db-password
  APP_PASSWORD: demo-app-password

db:
  image: postgres:16-alpine
  replicaCount: 1   # Postgres is not scaled out
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""

waitImage: busybox:1.36
